<text x="20" y="48" class="t"><tspan fill="#7ee787">$ </tspan><tspan class="cmd">laudo check</tspan></text>
<text x="20" y="88" class="t l0" xml:space="preserve"><tspan class="d">Laudo · 4 arquivos alterados · main → HEAD</tspan></text>
<text x="20" y="108" class="t l1" xml:space="preserve"></text>
<text x="20" y="128" class="t l2" xml:space="preserve"><tspan fill="#ff7b72" class="b">✖ BLOQUEADO</tspan><tspan>  2 problemas · 1 ponto para revisar</tspan></text>
<text x="20" y="148" class="t l3" xml:space="preserve"></text>
<text x="20" y="168" class="t l4" xml:space="preserve"><tspan class="b">Por onde revisar:</tspan><tspan> 16 linhas em 3 arquivos · 10 linhas triviais escondidas (1 arquivo)</tspan></text>
<text x="20" y="188" class="t l5" xml:space="preserve"><tspan>  </tspan><tspan class="d">1.</tspan><tspan> </tspan><tspan fill="#79c0ff">src/payments/refund.ts</tspan><tspan>  </tspan><tspan fill="#7ee787">+12</tspan><tspan> </tspan><tspan fill="#ff7b72">−0</tspan><tspan>  </tspan><tspan fill="#e3b341">dinheiro e pagamentos</tspan></text>
<text x="20" y="208" class="t l6" xml:space="preserve"><tspan>  </tspan><tspan class="d">2.</tspan><tspan> </tspan><tspan fill="#79c0ff">package.json</tspan><tspan>  </tspan><tspan fill="#7ee787">+1</tspan><tspan> </tspan><tspan fill="#ff7b72">−0</tspan><tspan>  </tspan><tspan class="d">config</tspan></text>
<text x="20" y="228" class="t l7" xml:space="preserve"><tspan>  </tspan><tspan class="d">3.</tspan><tspan> </tspan><tspan fill="#79c0ff">test/cart.test.ts</tspan><tspan>  </tspan><tspan fill="#7ee787">+2</tspan><tspan> </tspan><tspan fill="#ff7b72">−1</tspan><tspan>  </tspan><tspan class="d">teste</tspan></text>
<text x="20" y="248" class="t l8" xml:space="preserve"></text>
<text x="20" y="268" class="t l9" xml:space="preserve"><tspan>  </tspan><tspan fill="#ff7b72">✖</tspan><tspan> </tspan><tspan class="b">"lodahs" tem nome quase igual ao de "lodash"</tspan></text>
<text x="20" y="288" class="t l10" xml:space="preserve"><tspan>    </tspan><tspan fill="#79c0ff">package.json:6</tspan><tspan> · </tspan><tspan class="d">deps/typosquat</tspan></text>
<text x="20" y="308" class="t l11" xml:space="preserve"><tspan>    </tspan><tspan fill="#7ee787">+ "lodahs": "^1.0.0"</tspan></text>
<text x="20" y="328" class="t l12" xml:space="preserve"><tspan>    · em dependencies</tspan></text>
<text x="20" y="348" class="t l13" xml:space="preserve"><tspan>    · nome parecido com "lodash", um pacote popular</tspan></text>
<text x="20" y="368" class="t l14" xml:space="preserve"><tspan>    · publicado há 3 dias</tspan></text>
<text x="20" y="388" class="t l15" xml:space="preserve"><tspan>    · 12 downloads na última semana</tspan></text>
<text x="20" y="408" class="t l16" xml:space="preserve"><tspan>    </tspan><tspan class="d">→ Confira se o certo não é "lodash". Nomes parecidos são um golpe comum para instalar código malicioso.</tspan></text>
<text x="20" y="428" class="t l17" xml:space="preserve"></text>
<text x="20" y="448" class="t l18" xml:space="preserve"><tspan>  </tspan><tspan fill="#ff7b72">✖</tspan><tspan> </tspan><tspan class="b">Assert trocado por um que sempre passa em "soma preço vezes quantidade"</tspan></text>
<text x="20" y="468" class="t l19" xml:space="preserve"><tspan>    </tspan><tspan fill="#79c0ff">test/cart.test.ts:7</tspan><tspan> · </tspan><tspan class="d">tests/tautology</tspan></text>
<text x="20" y="488" class="t l20" xml:space="preserve"><tspan>    </tspan><tspan fill="#ff7b72">- expect(total([{ price: 10, qty: 2 }, { price: 11, qty: 2 }])).toBe(42)</tspan></text>
<text x="20" y="508" class="t l21" xml:space="preserve"><tspan>    </tspan><tspan fill="#7ee787">+ expect(result).toBe(result)</tspan></text>
<text x="20" y="528" class="t l22" xml:space="preserve"><tspan>    </tspan><tspan class="d">→ Esse assert compara um valor com ele mesmo (ou com uma constante): passa sempre e não testa nada.</tspan></text>
<text x="20" y="548" class="t l23" xml:space="preserve"></text>
<text x="20" y="568" class="t l24" xml:space="preserve"><tspan>  </tspan><tspan fill="#e3b341">●</tspan><tspan> </tspan><tspan class="b">Mudança em zona sensível: dinheiro e pagamentos</tspan></text>
<text x="20" y="588" class="t l25" xml:space="preserve"><tspan>    </tspan><tspan fill="#79c0ff">src/payments/refund.ts</tspan><tspan> · </tspan><tspan class="d">risk/sensitive-zone</tspan></text>
<text x="20" y="608" class="t l26" xml:space="preserve"><tspan>    · src/payments/refund.ts (+12 −0)</tspan></text>
<text x="20" y="628" class="t l27" xml:space="preserve"><tspan>    </tspan><tspan class="d">→ Erros aqui custam caro. Revise estes arquivos com calma, de preferência com quem conhece a área.</tspan></text>
